<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Twent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Caminho do CSS ajustado (sem a barra inicial) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tela" id="tela"></div>
    <img id="capa-img" src="" alt="">

    <div class="painel" id="painel">
        <div class="capa-central" id="capa-central">
            <video id="capa-principal-video" autoplay muted playsinline disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback noplaybackrate" style="display:none;"></video>
            <img id="capa-principal-img" src="" alt="">
        </div>

        <div class="info-musica-container">
            <!-- Foto do usuário + "está ouvindo:" -->
            <div class="status-lastfm">
                <div class="foto-usuario-wrapper">
                    <img id="foto-usuario" src="" alt="" style="display: none;">
                </div>
                <span class="texto-lastfm">
                    <span id="usuario-status">—</span> está ouvindo:
                </span>
            </div>

            <!-- Título e Artista -->
            <div class="info-musica">
                <h1 id="musica"></h1>
                <p id="artista"></p>
            </div>

            <!-- Last.fm + Separador + Scrobbles (Abaixo do artista) -->
            <div class="scrobbles-container" id="scrobbles-container" style="display: none;">
                <div class="icone-lastfm-wrapper">
                    <div class="icone-lastfm-mask"></div>
                </div>
                <div class="separador-bolinha"></div>
                <span id="total-scrobbles">0 scrobbles</span>
            </div>
        </div>
    </div>

    <div class="assistive" id="assistive">
        <div class="assistive-painel">
            <div class="assistive-menu" id="assistive-menu">
                <button class="assistive-opcao" id="opcao-pesquisar" aria-label="Pesquisar usuário">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <button class="assistive-opcao" id="opcao-ultimo" aria-label="Pesquisar último usuário">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="modal-pesquisa" id="modal-pesquisa">
        <div class="modal-container">
            <div class="modal-conteudo">
                <input type="text" id="input-busca" placeholder="Usuário do Last.fm" autocomplete="off">
                <button id="btn-pesquisar-confirmar" aria-label="Confirmar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <!-- Caminho do JS ajustado (sem a barra inicial) -->
    <script src="script.js"></script>
</body>
</html>
