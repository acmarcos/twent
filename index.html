<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Twent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Fundo base colorido -->
    <div class="tela" id="tela"></div>

    <!-- O OVERLAY: Imagem desfocada -->
    <img id="capa-img" src="" alt="">

    <!-- VISUAL PADRÃO -->
    <div class="painel" id="painel">
        <!-- Capa Nítida (3:4) -->
        <div class="capa-central" id="capa-central">
            <video id="capa-principal-video" autoplay muted playsinline disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback noplaybackrate" style="display:none;"></video>
            <img id="capa-principal-img" src="" alt="">
        </div>

        <!-- Textos -->
        <div class="info-musica-container">
            <div class="status-lastfm">
                <div class="icone-lastfm-wrapper">
                    <div class="icone-lastfm-mask"></div>
                </div>
                <span class="texto-lastfm">
                    <span id="usuario-status">—</span> está ouvindo:
                </span>
            </div>

            <div class="info-musica">
                <h1 id="musica"></h1>
                <p id="artista"></p>
            </div>
        </div>
    </div>

    <!-- ASSISTENTE (FROSTED GLASS) -->
    <div class="assistive" id="assistive">
        <div class="assistive-painel">
            <div class="assistive-menu" id="assistive-menu">
                <button class="assistive-opcao" id="opcao-pesquisar" aria-label="Pesquisar usuário">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <button class="assistive-opcao" id="opcao-ultimo" aria-label="Pesquisar último usuário">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE PESQUISA -->
    <div class="modal-pesquisa" id="modal-pesquisa">
        <div class="modal-container">
            <div class="modal-topo">
                <button class="modal-voltar" id="modal-voltar" aria-label="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="modal-conteudo">
                    <input type="text" id="input-busca" placeholder="Usuário do Last.fm" autocomplete="off">
                    <button id="btn-pesquisar-confirmar" aria-label="Confirmar">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="/script.js"></script>
</body>
</html>
